    <script>
      (function() {
        // Fix for browser extensions that attempt to assign window.fetch when it only has a getter
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch || _origFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        try {
          var saved = localStorage.getItem('vocalis_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Global unhandled error logging (ignoring third-party browser extensions)
        window.addEventListener('error', function(e) {
          var filename = (e && e.filename) || '';
          var msg = (e && e.message) || (e && e.error && e.error.message) || '';
          var stack = (e && e.error && e.error.stack) || '';

          if (
            filename.indexOf('chrome-extension:') !== -1 ||
            filename.indexOf('moz-extension:') !== -1 ||
            stack.indexOf('chrome-extension:') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            return;
          }

          console.error('[Vocalis Runtime Tracker]:', e.error || msg);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          var reasonStr = String(reason);
          if (
            reasonStr.indexOf('chrome-extension:') !== -1 ||
            reasonStr.indexOf('Cannot set property fetch') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            return;
          }
          console.warn('[Vocalis Unhandled Rejection]:', reason);
        });

        // Remove apenas o antigo service-worker.js legado caso esteja em cache, preservando o /sw.js da PWA
        window.addEventListener('load', function() {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  var scriptUrl = (regs[i].active && regs[i].active.scriptURL) || '';
                  if (scriptUrl.indexOf('/service-worker.js') !== -1) {
                    regs[i].unregister().catch(function() {});
                  }
                }
              }).catch(function() {});
            }
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">
    <div id="root">
      <!-- Loading fallback visual elegante exibido antes da montagem do React -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, #0d9488, #0f766e); color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.35); margin-bottom: 16px;">
          V
        </div>
        <div style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; color: #0f172a;">
          Vocalis
        </div>
        <div style="font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 24px;">
          Terapia Vocal & Fonoaudiologia
        </div>
        <div style="width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #0d9488; border-radius: 50%; animation: vocalisSpin 0.75s linear infinite;"></div>
        <style>
          @keyframes vocalisSpin { to { transform: rotate(360deg); } }
          @media (prefers-color-scheme: dark) {
            #root > div { background-color: #020617 !important; color: #f8fafc !important; }
            #root > div > div:nth-child(2) { color: #f8fafc !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
