    <script>
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(val) { _f = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          /* ignore if environment prevents redefinition */
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vocalis_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
